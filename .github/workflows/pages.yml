name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "reports/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          mkdir -p _site/reports
          cp -r site/* _site/
          cp -r reports/weekly _site/reports/weekly || true
          cp -r reports/monthly _site/reports/monthly || true
          cp docs/*.md _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
