name: monthly-snapshot-and-radar
on:
  schedule:
    - cron: "23 4 1 * *"     # 1st of month 04:23 UTC
  workflow_dispatch:
concurrency:
  group: monthly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - name: full SEK snapshot (46 committees, all statuses)
        run: PYTHONPATH=src python -m standards_fabric snapshot
      - name: rebuild twin + gate
        run: |
          PYTHONPATH=src python -m standards_fabric build
          PYTHONPATH=src python -m standards_fabric gate
      - name: monthly report (all agents + options radar)
        env:
          SF_LLM: ${{ secrets.SF_LLM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SF_MODEL: ${{ vars.SF_MODEL }}
        run: PYTHONPATH=src python -m standards_fabric report monthly
      - name: record scheduled run (MVT M3/M10)
        env:
          SF_CADENCE: monthly
        run: python scripts/record_run.py --minutes $(( ( $(date +%s) - $START ) / 60 ))
      - name: commit
        run: |
          git config user.name "standards-fabric[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots reports site data/mvt_evidence.json
          git commit -m "monthly snapshot + radar $(date -u +%Y-%m)" || echo "nothing to commit"
          git push
