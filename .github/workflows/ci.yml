name: ci
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "data/**", "site/template.html", "catalog/**", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "data/**", "site/template.html", "catalog/**", "pyproject.toml", ".github/workflows/ci.yml"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest ruff
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: build twin from committed snapshot + gate
        run: |
          PYTHONPATH=src python -m standards_fabric build
          PYTHONPATH=src python -m standards_fabric gate
